name: Memoria de cálculo

on:
  push:
    branches: [main]
    paths:
      - "planilla/**"
      - "memoria/**"
      - "scripts/exportar_datos.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  memoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recalcular la planilla (LibreOffice, sin guardar en el repo)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc-nogui > /dev/null
          mkdir -p /tmp/lop/user /tmp/recalc
          cat > /tmp/lop/user/registrymodifications.xcu <<'XCU'
          <?xml version="1.0" encoding="UTF-8"?>
          <oor:items xmlns:oor="http://openoffice.org/2001/registry" xmlns:xs="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <item oor:path="/org.openoffice.Office.Calc/Formula/Load"><prop oor:name="OOXMLRecalcMode" oor:op="fuse"><value>0</value></prop></item>
          </oor:items>
          XCU
          sed -i 's/^ *//' /tmp/lop/user/registrymodifications.xcu
          soffice -env:UserInstallation=file:///tmp/lop --headless --convert-to xlsx:"Calc MS Excel 2007 XML" \
            --outdir /tmp/recalc planilla/Rullo_PSV_estatico_fatiga.xlsx

      - name: Exportar datos de la planilla
        run: |
          pip install openpyxl matplotlib
          python scripts/exportar_datos.py /tmp/recalc/Rullo_PSV_estatico_fatiga.xlsx

      - name: Compilar LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: memoria.tex
          working_directory: memoria

      - name: Subir PDF actualizado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Memoria actualizada [skip ci]"
          file_pattern: "memoria/memoria.pdf memoria/datos.tex memoria/figuras/diagramas.pdf"
